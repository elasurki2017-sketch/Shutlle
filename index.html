<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuttle Travel - Driver</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 15px; color: #1c1e21; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #198754; }
        .card { background: #ffffff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 8px; font-size: 14px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-success { background-color: #198754; color: white; }
        .btn-primary { background-color: #0d6efd; color: white; margin-top: 10px; }
        .btn-toggle-online { background-color: #198754; color: white; margin-top: 10px; }
        .btn-toggle-offline { background-color: #dc3545; color: white; margin-top: 10px; }
        .btn-clear { background-color: #6c757d; color: white; padding: 6px 12px; font-size: 12px; border-radius: 6px; width: auto; float: right; }
        .status-badge { display: block; text-align: center; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-top: 10px; }
        .status-TAKEN { background-color: #e2e3e5; color: #41464b; }
        .status-ACCEPTED { background-color: #d1e7dd; color: #0f5132; }
        .info-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 6px; }
        .hidden { display: none !important; }
        .driver-profile { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .status-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        .is-online { background-color: #198754; }
        .is-offline { background-color: #dc3545; }
        .history-item { border-left: 4px solid #198754; background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
        .history-date { font-size: 11px; color: #6c757d; margin-bottom: 4px; }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

    <div class="header">
        <h2>Shuttle Driver</h2>
    </div>

    <!-- MODAL REGISTRASI DRIVER -->
    <div id="setup-container" class="card">
        <h3 style="margin-top:0; font-size: 16px; color: #198754;">Registrasi Pengemudi</h3>
        <input type="text" id="input-driver-name" placeholder="Nama Anda">
        <button class="btn-success" onclick="simpanNamaDriver()" style="margin-top:10px;">Simpan & Masuk</button>
    </div>

    <!-- TAMPILAN UTAMA -->
    <div id="main-container" class="hidden">
        <!-- PROFIL & STATUS DRIVER -->
        <div class="card">
            <div class="driver-profile">
                <div>
                    <span style="font-size: 12px; color: #65676b;">Pengemudi:</span><br>
                    <strong id="display-driver-name" style="font-size: 15px; color: #198754;">-</strong>
                </div>
                <button style="width: auto; padding: 5px 10px; font-size: 12px; background: #6c757d; color: white;" onclick="gantiNamaDriver()">Ubah</button>
            </div>
            <div style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">
                Status: <span id="status-indicator-icon" class="status-indicator"></span><span id="text-online-status"></span>
            </div>
            <button id="btn-status-toggle" onclick="toggleOnlineStatus()">Status</button>
        </div>

        <!-- PESANAN MASUK -->
        <div class="card">
            <h3 style="margin-top: 0; font-size: 16px;">Pesanan Masuk</h3>
            <div id="order-content">
                <p style="text-align: center; color: #65676b; margin: 20px 0;">Menunggu pesanan...</p>
            </div>
        </div>

        <!-- RIWAYAT LOKAL DRIVER -->
        <div class="card">
            <div style="overflow: hidden; margin-bottom: 10px;">
                <button class="btn-clear" onclick="hapusRiwayat()">Hapus Riwayat</button>
                <h3 style="margin: 0; font-size: 16px; line-height: 28px;">Riwayat Penerimaan</h3>
            </div>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCx_fMna5DUmdfkIobXsUxxs4YEkq-yz0k",
            authDomain: "aplikasishuttle.firebaseapp.com",
            databaseURL: "https://aplikasishuttle-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "aplikasishuttle",
            storageBucket: "aplikasishuttle.firebasestorage.app",
            messagingSenderId: "895559102631",
            appId: "1:895559102631:web:e373a31cfb5cf5f9292b82"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Sound Notifikasi
        const notificationSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        let currentDriverName = localStorage.getItem('DRIVER_NAME') || '';
        let isOnline = localStorage.getItem('DRIVER_ONLINE_STATUS') !== 'OFFLINE';
        let orderListener = null;
        let activeOrderData = null; 

        window.onload = function() {
            initApp();
            tampilkanRiwayat();
        };

        function initApp() {
            if (!currentDriverName) {
                document.getElementById('setup-container').classList.remove('hidden');
                document.getElementById('main-container').classList.add('hidden');
            } else {
                document.getElementById('setup-container').classList.add('hidden');
                document.getElementById('main-container').classList.remove('hidden');
                document.getElementById('display-driver-name').innerText = currentDriverName;
                updateOnlineUI();
            }
        }

        function toggleOnlineStatus() {
            isOnline = !isOnline;
            localStorage.setItem('DRIVER_ONLINE_STATUS', isOnline ? 'ONLINE' : 'OFFLINE');
            updateOnlineUI();
        }

        function updateOnlineUI() {
            const statusText = document.getElementById('text-online-status');
            const statusIcon = document.getElementById('status-indicator-icon');
            const toggleBtn = document.getElementById('btn-status-toggle');
            
            if (isOnline) {
                statusText.innerText = "ONLINE"; statusText.style.color = "#198754";
                statusIcon.className = "status-indicator is-online";
                toggleBtn.innerText = "Beralih ke OFFLINE"; toggleBtn.className = "btn-toggle-offline";
                listenOrders();
            } else {
                statusText.innerText = "OFFLINE"; statusText.style.color = "#dc3545";
                statusIcon.className = "status-indicator is-offline";
                toggleBtn.innerText = "Beralih ke ONLINE"; toggleBtn.className = "btn-toggle-online";
                if (orderListener) db.ref('pesanan_aktif').off('value', orderListener);
                document.getElementById('order-content').innerHTML = `<p style="text-align: center; color: #dc3545; padding: 10px;">Anda sedang OFFLINE.</p>`;
            }
        }

        function listenOrders() {
            if (orderListener) db.ref('pesanan_aktif').off('value', orderListener);
            orderListener = db.ref('pesanan_aktif').on('value', (snapshot) => {
                const pesanan = snapshot.val();
                const container = document.getElementById('order-content');

                if (pesanan) {
                    // Bunyikan notifikasi jika ada pesanan baru berstatus PENDING
                    if (pesanan.status === 'PENDING' && (!activeOrderData || activeOrderData.id !== pesanan.id)) {
                        notificationSound.play().catch(e => console.log("Audio play failed:", e));
                    }
                    
                    activeOrderData = pesanan; 

                    let actionArea = pesanan.status === 'PENDING' ? 
                        `<button class="btn-success" onclick="terimaPesanan()">Terima Penjemputan</button>` :
                        (pesanan.driver === currentDriverName ? 
                        `<div class="status-badge status-ACCEPTED">ANDA MENGAMBIL PESANAN INI</div><button class="btn-primary" onclick="selesaiPesanan()">Selesaikan Penjemputan</button>` :
                        `<div class="status-badge status-TAKEN">DITERIMA OLEH ${pesanan.driver.toUpperCase()}</div>`);

                    container.innerHTML = `
                        <div class="info-row"><span>ID:</span><strong>${pesanan.id}</strong></div>
                        <div class="info-row"><span>Penumpang:</span><strong>${pesanan.user_name || 'Penumpang'}</strong></div>
                        <div class="info-row"><span>Jemput:</span><strong>${pesanan.pickup}</strong></div>
                        <div class="info-row"><span>Tujuan:</span><strong>${pesanan.dropoff}</strong></div>
                        ${actionArea}`;
                } else {
                    activeOrderData = null;
                    container.innerHTML = `<p style="text-align: center; color: #65676b; margin: 20px 0;">Tidak ada pesanan.</p>`;
                }
            });
        }

        function terimaPesanan() { 
            db.ref('pesanan_aktif').update({
                status: 'ACCEPTED', 
                driver: currentDriverName
            }); 
        }

        function selesaiPesanan() {
            if (confirm("Selesaikan penjemputan ini?")) {
                // 1. Simpan ke Riwayat Lokal HP Driver
                simpanKeRiwayatLokal(activeOrderData); 
                
                // 2. Simpan Permanen ke Firebase Database
                simpanKeFirebaseHistory(activeOrderData);

                // 3. Hapus dari daftar pesanan aktif
                db.ref('pesanan_aktif').remove();
            }
        }

        // --- FUNGSI RIWAYAT PERMANEN DI FIREBASE ---
        function simpanKeFirebaseHistory(data) {
            if (!data) return;
            const historyId = 'HIST-' + Date.now();
            
            db.ref('riwayat_pesanan/' + historyId).set({
                id_pesanan: data.id || '-',
                penumpang: data.user_name || 'Penumpang',
                driver: currentDriverName,
                jemput: data.pickup,
                tujuan: data.dropoff,
                waktu_selesai: new Date().toLocaleString('id-ID')
            });
        }

        // --- FUNGSI RIWAYAT LOKAL ---
        function simpanKeRiwayatLokal(data) {
            let history = JSON.parse(localStorage.getItem('DRIVER_HISTORY') || '[]');
            data.waktu_selesai = new Date().toLocaleString('id-ID');
            history.unshift(data);
            localStorage.setItem('DRIVER_HISTORY', JSON.stringify(history));
            tampilkanRiwayat();
        }

        function tampilkanRiwayat() {
            const list = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('DRIVER_HISTORY') || '[]');
            list.innerHTML = history.length === 0 ? '<p style="text-align:center; color:#999; font-size:12px;">Belum ada riwayat.</p>' : '';
            
            history.forEach(item => {
                list.innerHTML += `
                    <div class="history-item">
                        <div class="history-date">📅 ${item.waktu_selesai}</div>
                        <div style="font-weight: bold; margin-bottom: 4px;">👤 ${item.user_name || 'Penumpang'}</div>
                        <div>📍 ${item.pickup} ➔ 🏁 ${item.dropoff}</div>
                    </div>`;
            });
        }

        function hapusRiwayat() {
            if(confirm("Hapus semua riwayat lokal?")) { 
                localStorage.removeItem('DRIVER_HISTORY'); 
                tampilkanRiwayat(); 
            }
        }

        function simpanNamaDriver() { 
            const name = document.getElementById('input-driver-name').value.trim();
            if(name) { 
                localStorage.setItem('DRIVER_NAME', name); 
                location.reload(); 
            }
        }

        function gantiNamaDriver() { 
            localStorage.removeItem('DRIVER_NAME'); 
            location.reload(); 
        }
    </script>
</body>
</html>
